name: cards
type: spring-service

use:
  profile: spring-service

owners:
  teams: [cards-team]

depends_on:
  - module: vrtx-common
    affects: [test, build, package, scan]

quality:
  format: strict
  lint: strict
  security: fintech-service
  performance: standard

reviews:
  default:
    require:
      owners: 1
      expert: 1

  sensitive_card_data:
    when:
      - src/main/**/CardToken*.java
      - regex: (^|/)src/main/.*/(Visa|Tokenization).*\.java$
    request:
      teams: [security-team]
    require:
      owners: 1
      expert: 1
      teams:
        security-team: 1

performance:
  budgets:
    validate: 5m
    test: 20m
    build: 15m
    scan: 15m
