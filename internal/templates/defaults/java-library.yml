name: java-library
type: java-library

quality:
  format: strict
  lint: strict
  security: standard
  performance: standard

ci:
  validate:
    when: [pom.xml, src/**, .ci/**]
    setup:
      java: {distribution: liberica, version: 25}
    steps:
      - name: Validate
        run: cd "$FRODO_REPO_ROOT" && ./mvnw -q -pl "$FRODO_MODULE_PATH" -am validate

  test:
    when: [pom.xml, src/main/**, src/test/**]
    setup:
      java: {distribution: liberica, version: 25}
    cache:
      paths: [~/.m2/repository]
    steps:
      - name: Unit tests
        run: cd "$FRODO_REPO_ROOT" && ./mvnw -q -pl "$FRODO_MODULE_PATH" -am test

  build:
    when: [pom.xml, src/main/**]
    setup:
      java: {distribution: liberica, version: 25}
    cache:
      paths: [~/.m2/repository]
    steps:
      - name: Build
        run: cd "$FRODO_REPO_ROOT" && ./mvnw -q -pl "$FRODO_MODULE_PATH" -am -DskipTests package

  scan:
    when: [pom.xml, src/**]
    security:
      profile: standard

cd:
  publish:
    when: [pom.xml, src/main/**]
    steps:
      - name: Publish artifact
        run: cd "$FRODO_REPO_ROOT" && ./mvnw -q -pl "$FRODO_MODULE_PATH" -am -DskipTests deploy
