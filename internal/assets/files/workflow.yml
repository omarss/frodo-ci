name: Frodo CI

# The only workflow Frodo CI needs. The single required status check for merge
# is "Frodo CI / final"; all module/stage checks are calculated and tracked
# internally by the action. Never use always() here -- the runner handles
# cleanup, summaries, check finalization, and reporting within bounded timeouts.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  # `submitted` belongs to pull_request_review (not pull_request); this lets the
  # final check re-evaluate "require approval after latest commit" on reviews.
  pull_request_review:
    types: [submitted, dismissed, edited]

  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for CD stages
        required: false
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: frodo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  packages: write
  deployments: write
  id-token: write

jobs:
  final:
    name: final
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Third-party actions are pinned to a full commit SHA (supply-chain
      # hardening); the trailing comment is the human-readable version.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Toolchains the default templates need. Trim what your repo does not use
      # (e.g. drop Java for a pure-Node repo) and add others (setup-go, etc.).
      # Frodo CI runs your stage steps but does not install language toolchains.
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: liberica
          java-version: "25"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Enable pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@latest --activate

      # Persist the fingerprint cache across runs so unchanged stages stay
      # skipped. The cache lives outside the workspace (survives checkout) and
      # accumulates via restore-keys. It never skips scan / CD / reviews.
      - name: Frodo CI cache directory
        shell: bash
        run: echo "FRODO_CI_CACHE_DIR=$HOME/.cache/frodo-ci" >> "$GITHUB_ENV"
      - name: Frodo CI cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/frodo-ci
          key: frodo-ci-cache-${{ github.run_id }}
          restore-keys: |
            frodo-ci-cache-

      - name: Run Frodo CI
        uses: omarss/frodo-ci@v1
        with:
          command: run
          environment: ${{ github.event.inputs.environment || 'staging' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
